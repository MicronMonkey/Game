name: Deploy chapter one
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate game scripts and baseline tests
        run: |
          node --check game/art.js
          node --check game/characters.js
          node --check game/evidence.js
          node --check game/story.js
          node --check game/chapters.js
          node --check game/scenery.js
          node --check game/navigation.js
          node --check game/cinematic.js
          node --check game/caseboard.js
          node --check game/upgrade.js
          node --check game/engine.js
          node --check game/chase.js
          node --check game/drill.js
          node --check game/mobile.js
          node --check game/fack_store.js
          node --check game/fack_adv_core.js
          node --check game/fack_adv_stages.js
          node --check game/fack_adv_ui.js
          node tests/smoke.cjs
          node tests/director.cjs
          node tests/drill.cjs
          node tests/expansion_store.cjs
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dual-city-1230/package-lock.json
      - name: Build 12:30 Dual City game (dual-city-1230/)
        working-directory: dual-city-1230
        run: |
          npm ci
          npm test
          npm run build
      - name: Assemble site (existing games unchanged + /dual-city-1230/ build)
        run: |
          mkdir -p _site
          tar --exclude=./.git --exclude=./_site --exclude=./dual-city-1230 -cf - . | tar -xf - -C _site
          cp -r dual-city-1230/dist _site/dual-city-1230
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
