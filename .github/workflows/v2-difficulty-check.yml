name: V2 gameplay difficulty check
on:
  push:
    paths:
      - '.github/workflows/v2-difficulty-check.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  play-12-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install selenium
      - name: Start local game server
        run: python -m http.server 8765 > /tmp/game-http.log 2>&1 &
      - name: Automated three trials per difficulty
        run: python -u .github/scripts/v2_difficulty_test.py
      - name: Publish automated gameplay results
        if: always()
        run: |
          if [ -f v2-test-results.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add v2-test-results.json
            git commit -m 'Record V2 twelve-run gameplay checks' || true
            git push || true
          fi
