name: V2 gameplay difficulty check
on:
  push:
    paths:
      - '.github/workflows/v2-difficulty-check.yml'
  workflow_dispatch:
jobs:
  play-12-runs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install Selenium
        run: python -m pip install selenium
      - name: Start local game server
        run: python -m http.server 8765 > /tmp/game-http.log 2>&1 &
      - name: Automated three trials per difficulty
        run: python -u .github/scripts/v2_difficulty_test.py
