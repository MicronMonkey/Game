  <div id="title"><h1>晶片沉默者：九人的協議</h1><p><b>玩法：</b>🔍 蒐集證物、♥ 取得同事信任、◆ 爭取會員支持。玩法只有四件事：觀察、移動、使用物品、邀請合作。點畫面上發光的人與物件；沒有標準答案，每個決定都會改變現場。</p><p>序章＋六章＋終章。你只是基層員工「雞雞HH」，想把一件小事問清楚。點一下畫面或按空白鍵繼續，選項可按數字鍵。</p><p>本作為虛構故事，公司與角色皆為虛構，不證明任何真實人物的行為。約 30 分鐘、自動存檔；已探索場景及已交談 NPC 會標記。</p><div><button class="pri" id="go">開始</button><button class="pri" id="ct" style="display:none">繼續</button></div></div>
